name: Setup Android CI
description: Configure Rust, just, sccache, and Java for Android CI.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust-ci

    - name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
      with:
        distribution: temurin
        java-version: "17"
