name: Setup Android CI
description: Configure Rust, just, sccache, and Java for Android CI.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust-ci

    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
      with:
        distribution: temurin
        java-version: "17"
