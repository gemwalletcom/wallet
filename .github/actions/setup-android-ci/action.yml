name: Setup Android CI
description: Configure Rust, just, sccache, and Java for Android CI.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust-ci

    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4
      with:
        distribution: temurin
        java-version: "17"
