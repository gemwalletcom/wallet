name: Setup iOS CI
description: Configure Rust, just, sccache, Xcode, and the iOS Simulator for iOS CI.

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Wait for iOS Simulator
      shell: bash
      working-directory: ios
      run: just wait-simulator

    - name: Start iOS Simulator
      shell: bash
      working-directory: ios
      run: just start-simulator

    - name: Setup Rust
      uses: ./.github/actions/setup-rust-ci
