version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "swift"
    directory: "/ios"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/core"
    open-pull-requests-limit: 2
    groups:
      alloy:
        patterns:
          - "alloy-*"
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
      # Moves with axum: the api matches the WebSocket errors axum wraps by their type.
      - dependency-name: "tokio-tungstenite"

  # Security updates only: the limit of 0 turns version updates off.
  - package-ecosystem: "gradle"
    directory: "/android"
    open-pull-requests-limit: 0
    groups:
      android-security:
        applies-to: security-updates
        patterns:
          - "*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "docker"
    directories:
      - "/core"
      - "/.oss-scanner"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Server images must not build with a compiler CI doesn't test: hold rust to the rust-toolchain.toml line.
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
