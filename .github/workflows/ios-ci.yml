name: iOS CI

on:
  push:
    branches: ["main"]
    paths:
      - "ios/**"
      - "core/**"
      - "rust-toolchain.toml"
      - "localization/**"
      - ".gitmodules"
      - ".github/actions/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ios/**"
      - "core/**"
      - "rust-toolchain.toml"
      - "localization/**"
      - ".gitmodules"
      - ".github/actions/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  unit_test:
    runs-on: xcode-27
    name: unit_test (${{ matrix.variant }}, ${{ matrix.attempt }})

    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-boot, no-boot-os-27.2, serial-no-boot]
        attempt: [1, 2]

    env:
      SIMULATOR_OS: ${{ matrix.variant == 'no-boot-os-27.2' && '27.2' || '27.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Setup iOS CI
        uses: ./.github/actions/setup-ios-ci

      - name: Start diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/diag/bin"
          echo "DIAG_DIR=$RUNNER_TEMP/diag" >> "$GITHUB_ENV"
          sysctl -n hw.ncpu hw.memsize > "$RUNNER_TEMP/diag/machine.txt"
          xcrun simctl list runtimes > "$RUNNER_TEMP/diag/simulators.txt"
          xcrun simctl list devices available >> "$RUNNER_TEMP/diag/simulators.txt"
          real_xcbeautify="$(command -v xcbeautify)"
          cat > "$RUNNER_TEMP/diag/bin/xcbeautify" <<SHIM
          #!/bin/bash
          perl -MPOSIX -ne 'BEGIN { \$| = 1; open(F, ">>", \$ENV{RAW_LOG}); select((select(F), \$| = 1)[0]) } print F strftime("%H:%M:%S ", gmtime), \$_; print' | "$real_xcbeautify" "\$@"
          SHIM
          chmod +x "$RUNNER_TEMP/diag/bin/xcbeautify"
          echo "$RUNNER_TEMP/diag/bin" >> "$GITHUB_PATH"
          nohup bash -c 'while true; do
            echo "=== $(date -u +%H:%M:%S) load $(sysctl -n vm.loadavg) swap $(sysctl -n vm.swapusage)"
            memory_pressure | tail -1
            ps -Ao pcpu,rss,etime,comm -r | head -15
            xcrun simctl list devices | grep Booted
            sleep 30
          done' > "$RUNNER_TEMP/diag/sampler.log" 2>&1 &

      - name: Install dependencies
        working-directory: ios
        run: just install-toolchains

      - name: Build Core
        working-directory: ios
        run: just generate-stone
        env:
          GEMSTONE_IOS_TARGETS: "aarch64-apple-ios-sim"

      - name: Resolve SPM Dependencies
        working-directory: ios
        run: just spm-resolve

      - name: Build for Testing
        working-directory: ios
        run: just build-for-testing
        env:
          RAW_LOG: ${{ runner.temp }}/diag/build.log

      - name: Unit Tests
        timeout-minutes: 60
        working-directory: ios
        env:
          RAW_LOG: ${{ runner.temp }}/diag/test.log
          VARIANT: ${{ matrix.variant }}
        run: |
          date -u +%H:%M:%S > "$DIAG_DIR/test-start.txt"
          case "$VARIANT" in
            baseline)
              just test-without-building
              ;;
            no-boot | no-boot-os-27.2)
              just _test test-without-building
              ;;
            serial-no-boot)
              set -o pipefail
              xcodebuild -project Gem.xcodeproj \
                -derivedDataPath build/DerivedData \
                -clonedSourcePackagesDirPath build/SourcePackages \
                -scheme Gem \
                -configuration Debug \
                -destination "platform=iOS Simulator,name=iPhone 17,OS=$SIMULATOR_OS" \
                ONLY_ACTIVE_ARCH=YES \
                -parallelizeTargets -jobs "$(getconf _NPROCESSORS_ONLN)" \
                "OTHER_LDFLAGS=\$(inherited) $PWD/../core/target/aarch64-apple-ios-sim/debug/libgemstone.a" \
                COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_LIMIT_SIZE=40G \
                -parallel-testing-enabled NO \
                test-without-building | grep --line-buffered -v '^[0-9]*! = ' | xcbeautify --quiet --is-ci
              ;;
          esac

      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unit-test-diagnostics-${{ matrix.variant }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/diag
