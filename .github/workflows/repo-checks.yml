name: Repo Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check mapper parity
        run: python3 ./scripts/check-mapper-parity.py

      - name: Check guidance links
        run: python3 ./scripts/check-docs-links.py

      - name: Check FFI surface
        run: python3 ./scripts/check-ffi-surface.py

      - name: Check boundary rules
        run: python3 ./scripts/check-boundaries.py

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
