name: UI Tests

run-name: "UI Tests: ${{ inputs.platform }} (${{ inputs.suite }})"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        type: choice
        options:
          - both
          - ios
          - android
        default: both
      suite:
        description: 'Which suite to run'
        required: false
        type: choice
        options:
          - all
          - native
          - maestro
        default: all
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: both
      suite:
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAESTRO_CLI_NO_ANALYTICS: 1
  SIMULATOR_OS: "27.0"

jobs:
  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: xcode-27
    # the ios recipes live in ios/justfile; only the root justfile has maestro-smoke
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup iOS CI
        uses: ./.github/actions/setup-ios-ci

      - name: Install dependencies
        run: just install-toolchains

      - name: Build Core
        run: just generate-stone
        env:
          GEMSTONE_IOS_TARGETS: "aarch64-apple-ios-sim"

      - name: Resolve SPM Dependencies
        run: just spm-resolve

      - name: Build for Testing
        run: just build-for-testing-integration

      - name: Native UI Tests
        if: ${{ inputs.suite != 'maestro' }}
        run: just test-integration-without-building

      - name: Setup Maestro
        if: ${{ inputs.suite != 'native' }}
        uses: ./.github/actions/setup-maestro

      - name: Maestro flows
        if: ${{ inputs.suite != 'native' }}
        working-directory: .
        run: just maestro-smoke ios

      - name: Upload Maestro artifacts
        if: ${{ failure() && inputs.suite != 'native' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios
          path: build/maestro/ios
          if-no-files-found: ignore

  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    # the android recipes live in android/justfile; only the root justfile has maestro-smoke
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Android CI
        uses: ./.github/actions/setup-android-ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android toolchains
        run: |
          just install-toolchains
          just install-ndk

      - name: Build the app
        run: just build

      # ubuntu-latest ships the SDK without the emulator package, so the runner adds it
      - name: Install the Android emulator
        if: ${{ inputs.suite != 'native' }}
        working-directory: .
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" | tail -2

      - name: Let the runner user open /dev/kvm
        if: ${{ inputs.suite != 'native' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Maestro
        if: ${{ inputs.suite != 'native' }}
        uses: ./.github/actions/setup-maestro

      - name: Maestro flows
        if: ${{ inputs.suite != 'native' }}
        working-directory: .
        run: just maestro-smoke android

      - name: Upload Maestro artifacts
        if: ${{ failure() && inputs.suite != 'native' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: build/maestro/android
          if-no-files-found: ignore
