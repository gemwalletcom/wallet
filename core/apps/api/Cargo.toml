[package]
name = "api"
edition = { workspace = true }
version = { workspace = true }

[features]
api_integration_tests = []

[[test]]
name = "contract"
test = false
required-features = ["api_integration_tests"]

[dependencies]
num-bigint = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
tower-http = { workspace = true }
strum = { workspace = true }
redis = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

metrics = { path = "../../crates/metrics" }
http_server = { path = "../../crates/http_server" }
gem_tracing = { path = "../../crates/gem_tracing" }
fiat = { path = "../../crates/fiat" }
settings = { path = "../../crates/settings" }
chain_providers = { path = "../../crates/chain_providers" }
name_resolver = { path = "../../crates/name_resolver" }
primitives = { path = "../../crates/primitives" }
services = { path = "../../crates/services" }
defi = { path = "../../crates/defi" }
nft = { path = "../../crates/nft" }
gem_client = { path = "../../crates/gem_client", features = ["reqwest"] }
swapper = { path = "../../crates/swapper", features = ["reqwest_provider"] }
localizer = { path = "../../crates/localizer" }

security = { path = "../../crates/security" }
gem_auth = { path = "../../crates/gem_auth", features = ["jwt"] }

[dev-dependencies]
primitives = { path = "../../crates/primitives", features = ["testkit"] }
rewards = { path = "../../crates/rewards" }
hex = { workspace = true }
reqwest = { workspace = true }
serde_urlencoded = { workspace = true }
signer = { path = "../../crates/signer" }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }
