[package]
name = "dynode"
version = { workspace = true }
edition = { workspace = true }

[features]
testkit = []
proxy_integration_tests = []

[[test]]
name = "proxy_integration"
test = false
required-features = ["proxy_integration_tests"]

[dependencies]
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { workspace = true }
rocket = { workspace = true }
primitives = { path = "../../crates/primitives" }
gem_tracing = { path = "../../crates/tracing" }
gem_client = { path = "../../crates/gem_client", features = ["reqwest"] }
gem_encoding = { path = "../../crates/gem_encoding", features = ["protobuf"] }
gem_hash = { path = "../../crates/gem_hash" }
rand = { workspace = true }
metrics = { path = "../../crates/metrics" }
settings_chain = { path = "../../crates/settings_chain" }
serde_serializers = { path = "../../crates/serde_serializers" }

url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
