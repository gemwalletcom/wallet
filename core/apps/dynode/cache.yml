cache:
  max_memory_mb: 1024
  chain_types:
    ethereum:
      - rpc_method: eth_chainId
        ttl: 1h
    tron:
      - path: /wallet/getchainparameters
        method: GET
        ttl: 1d
      - path: /wallet/listwitnesses
        method: GET
        ttl: 1d
    solana:
      - rpc_method: getVoteAccounts
        ttl: 1h
    cosmos:
      - path: /cosmos/staking/v1beta1/validators
        method: GET
        ttl: 1d
    hypercore:
      - path: /info
        method: POST
        ttl: 1h
        params:
          type: metaAndAssetCtxs
    aptos:
      - path: /v1/view
        method: POST
        ttl: 1h
        params:
          function: "0x1::delegation_pool::operator_commission_percentage"
  chains:
    ethereum:
      - rpc_method: eth_call
        contract: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
        selector: "0x1698ee82"
        ttl: 5m
    optimism:
      - rpc_method: eth_call
        contract: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
        selector: "0x1698ee82"
        ttl: 5m
    robinhood:
      - rpc_method: eth_call
        contract: "0x1f7d7550B1b028f7571E69A784071F0205FD2EfA"
        selector: "0x1698ee82"
        ttl: 5m
