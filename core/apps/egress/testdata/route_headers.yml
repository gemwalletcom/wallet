address: 127.0.0.1
port: 0
callers: {}
headers:
  forward: [accept]
request:
  timeout: 1s
  limit: 1 KiB
retry:
  cooldown: 1s
  statuses: [429]
routes:
  security:
    tronscan:
      selection: ordered
      headers:
        forward: [TRON-PRO-API-KEY, ACCEPT]
      endpoints: []
    goplus:
      selection: ordered
      headers:
        forward: [authorization]
      endpoints: []
    public:
      selection: ordered
      endpoints: []
