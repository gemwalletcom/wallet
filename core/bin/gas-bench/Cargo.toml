[package]
name = "gas-bench"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true, features = ["env"] }

tokio = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, features = ["derive"] }

primitives = { path = "../../crates/primitives" }
gem_client = { path = "../../crates/gem_client", features = ["reqwest"] }
gemstone = { path = "../../gemstone", features = ["reqwest_provider"] }
gem_evm = { path = "../../crates/gem_evm", features = ["rpc"] }
gem_solana = { path = "../../crates/gem_solana", features = ["reqwest", "rpc"] }
gem_jsonrpc = { path = "../../crates/gem_jsonrpc", features = ["client"] }
etherscan = { path = "../../crates/etherscan" }
