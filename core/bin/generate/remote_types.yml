# Type names the generator has to know besides the ones above: what passes through a mapper
# untouched, and what gemstone declares under another name (an unqualified name is a gemstone
# custom type, and the declarations import it).
scalars:
  - String
  - i8
  - i16
  - i32
  - i64
  - u8
  - u16
  - u32
  - u64
  - bool
  - f32
  - f64
defaults:
  PriceProvider: Coingecko
  AssetRank: Unknown

conversions:
  UInt64:
    kotlin:
      - "{}.toLong()"
      - "{}.toULong()"
  BigInt:
    kotlin:
      - "{}.toString()"
      - "java.math.BigInteger({})"
    swift:
      - "{}.description"
      - "BigInt(stringLiteral: {})"
  BigUint:
    kotlin:
      - "{}.toString()"
      - "java.math.BigInteger({})"
    swift:
      - "{}.description"
      - "BigUInt(stringLiteral: {})"
  serde_json::Value:
    swift:
      - "AnyCodableValue(core: {})"
      - "{}.json()"

declared:
  BigInt: GemBigInt
  UInt64: primitives::UInt64
  serde_json::Value: GemJsonValue
  BigUint: GemBigUint
  DateTime<Utc>: chrono::DateTime<chrono::Utc>
