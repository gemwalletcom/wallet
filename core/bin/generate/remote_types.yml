# Type names the generator has to know besides the ones above: what passes through a mapper
# untouched, and what gemstone declares under another name (an unqualified name is a gemstone
# custom type, and the declarations import it).
scalars:
  - String
  - i8
  - i16
  - i32
  - i64
  - u8
  - u16
  - u32
  - u64
  - bool
  - f32
  - f64
defaults:
  PriceProvider: Coingecko
  AssetRank: Unknown

conversions:
  u64:
    kotlin:
      - "{}.toLong()"
      - "{}.toULong()"
  BigInt:
    kotlin:
      - "{}.toString()"
      - "java.math.BigInteger({})"
    swift:
      - "{}.description"
      - "BigInt(stringLiteral: {})"
  BigUint:
    kotlin:
      - "{}.toString()"
      - "java.math.BigInteger({})"
    swift:
      - "{}.description"
      - "BigUInt(stringLiteral: {})"
  BigIntValue:
    swift:
      - "BigInt({})"
      - "{}.magnitude"
  serde_json::Value:
    swift:
      - "AnyCodableValue(core: {})"
      - "{}.json()"

# Aliases gemstone uses from other crates, which UniFFI resolves to the aliased type.
aliases:
  SwapperProvider: SwapProvider
declared:
  NaiveDateTime: primitives::chrono::NaiveDateTime
  BigInt: GemBigInt
  serde_json::Value: GemJsonValue
  BigUint: GemBigUint
  BigIntValue: GemBigUint
  DateTime<Utc>: chrono::DateTime<chrono::Utc>

type_mappings:
  swift:
    BigInt: String
    BigIntValue: BigIntValue
    BigUint: String
    DateTime: Date
    Value: AnyCodableValue
    u64: UInt64
  kotlin:
    BigInt: String
    BigIntValue: SerializedBigInteger
    BigUint: String
    DateTime: SerializedDate
    Value: JsonValue
    u64: Long
