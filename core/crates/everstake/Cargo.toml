[package]
name = "everstake"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["gem_evm/rpc", "dep:async-trait", "dep:gem_client", "dep:serde", "dep:serde_serializers"]
reqwest = ["rpc", "gem_evm/reqwest", "gem_client/reqwest"]
chain_integration_tests = ["rpc", "reqwest"]

[dependencies]
primitives = { path = "../primitives" }
gem_evm = { path = "../gem_evm" }
serde_serializers = { path = "../serde_serializers", optional = true }

gem_client = { path = "../gem_client", optional = true }
async-trait = { workspace = true, optional = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
everstake = { path = ".", features = ["rpc"] }
gem_evm = { path = "../gem_evm", features = ["rpc"] }
gem_client = { path = "../gem_client" }
settings = { path = "../settings" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
chrono = { workspace = true }
