[package]
name = "everstake"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["gem_evm/rpc", "dep:async-trait", "dep:gem_client", "dep:serde", "dep:serde_serializers", "dep:gem_evm", "dep:primitives", "dep:alloy-primitives", "dep:alloy-sol-types", "dep:num-bigint", "dep:num-traits"]
chain_integration_tests = ["rpc"]

[dependencies]
primitives = { path = "../primitives", optional = true }
gem_evm = { path = "../gem_evm", optional = true }
serde_serializers = { path = "../serde_serializers", optional = true }

gem_client = { path = "../gem_client", optional = true }
async-trait = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-sol-types = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_jsonrpc = { path = "../gem_jsonrpc" }
everstake = { path = ".", features = ["rpc"] }
gem_evm = { path = "../gem_evm", features = ["rpc"] }
gem_client = { path = "../gem_client" }
settings = { path = "../settings" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
