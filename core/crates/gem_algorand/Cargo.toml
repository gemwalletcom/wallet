[package]
name = "gem_algorand"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["dep:async-trait", "dep:chain_traits", "dep:gem_client", "dep:futures"]
signer = ["dep:num-traits"]
chain_integration_tests = ["rpc"]

[dependencies]
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
gem_encoding = { path = "../gem_encoding", features = ["base32"] }
num-bigint = { workspace = true }
num-traits = { workspace = true, optional = true }

primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
chain_traits = { path = "../chain_traits", optional = true }
gem_client = { path = "../gem_client", optional = true }
gem_hash = { path = "../gem_hash" }
signer = { path = "../signer" }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_algorand = { path = ".", features = ["rpc", "signer"] }
chain_traits = { path = "../chain_traits" }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings" }
