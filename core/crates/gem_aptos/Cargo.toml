[package]
name = "gem_aptos"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:chain_traits",
    "dep:chain_primitives",
    "dep:gem_client",
    "dep:futures",
]
chain_integration_tests = ["rpc"]

[dependencies]
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }
num-bigint = { workspace = true }
bcs = { workspace = true }
num-traits = { workspace = true }
signer = { path = "../signer" }
gem_hash = { path = "../gem_hash" }

# Dependencies for RPC client & mapper
async-trait = { workspace = true, optional = true }
chain_traits = { path = "../chain_traits", optional = true }
chain_primitives = { path = "../chain_primitives", optional = true }
gem_client = { path = "../gem_client", optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_aptos = { path = ".", features = ["rpc"] }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings" }
ed25519-dalek = { workspace = true, default-features = false }
