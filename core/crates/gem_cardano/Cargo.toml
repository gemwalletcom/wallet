[package]
name = "gem_cardano"
version = { workspace = true }
edition = { workspace = true }
publish = false

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:bech32",
    "dep:chain_traits",
    "dep:futures",
    "dep:gem_client",
    "dep:gem_hash",
    "dep:num-traits",
    "dep:serde_json",
]
signer = [
    "dep:bech32",
    "dep:curve25519-dalek",
    "dep:gem_hash",
    "dep:num-traits",
    "dep:sha2",
    "dep:zeroize",
]
chain_integration_tests = ["rpc"]

[dependencies]
primitives = { path = "../primitives" }
num-bigint = { workspace = true }
serde_serializers = { path = "../serde_serializers" }
bech32 = { workspace = true, optional = true }
gem_hash = { path = "../gem_hash", optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chain_traits = { path = "../chain_traits", optional = true }
gem_client = { path = "../gem_client", optional = true }
num-traits = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_cardano = { path = ".", features = ["rpc", "signer"] }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros"] }
settings = { path = "../settings" }
