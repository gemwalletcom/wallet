[package]
name = "gem_cosmos"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
bech32 = { workspace = true }
gem_hash = { path = "../gem_hash", optional = true }
gem_encoding = { path = "../gem_encoding" }
primitives = { path = "../primitives" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_serializers = { path = "../serde_serializers" }

# Optional RPC dependencies
async-trait = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
futures-util = { workspace = true, optional = true }
number_formatter = { path = "../number_formatter", optional = true }

signer = { path = "../signer", optional = true }

num-bigint = { workspace = true }

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:futures-util",
    "dep:number_formatter",
    "dep:gem_hash",
]
signer = ["dep:signer", "gem_encoding/protobuf", "dep:gem_hash"]
chain_integration_tests = ["rpc"]

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_cosmos = { path = ".", features = ["rpc", "signer"] }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings" }
