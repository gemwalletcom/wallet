[package]
name = "gem_crypto"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
pbkdf = ["dep:gem_hash", "dep:zeroize"]
random = ["dep:getrandom"]

[dependencies]
gem_hash = { path = "../gem_hash", optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
gem_crypto = { path = ".", features = ["pbkdf", "random"] }
gem_encoding = { path = "../gem_encoding", default-features = false }
