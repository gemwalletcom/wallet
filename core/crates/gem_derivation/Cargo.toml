[package]
name = "gem_derivation"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
gem_algorand = { path = "../gem_algorand", default-features = false }
gem_aptos = { path = "../gem_aptos", default-features = false }
gem_bitcoin = { path = "../gem_bitcoin", default-features = false, features = ["signer"] }
gem_cardano = { path = "../gem_cardano", default-features = false, features = ["signer"] }
gem_cosmos = { path = "../gem_cosmos", default-features = false }
gem_crypto = { path = "../gem_crypto", features = ["hash", "pbkdf"] }
gem_evm = { path = "../gem_evm", default-features = false }
gem_hash = { path = "../gem_hash" }
gem_keystore = { path = "../gem_keystore" }
gem_polkadot = { path = "../gem_polkadot", default-features = false }
gem_solana = { path = "../gem_solana", default-features = false }
gem_stellar = { path = "../gem_stellar", default-features = false, features = ["signer"] }
gem_sui = { path = "../gem_sui", default-features = false }
gem_ton = { path = "../gem_ton", default-features = false, features = ["signer"] }
gem_tron = { path = "../gem_tron", default-features = false }
gem_xrp = { path = "../gem_xrp", default-features = false }
bitcoin = { workspace = true }
bs58 = { workspace = true }
primitives = { path = "../primitives" }
signer = { path = "../signer" }
zeroize = { workspace = true }

[dev-dependencies]
primitives = { path = "../primitives", features = ["testkit"] }
serde = { workspace = true }
serde_json = { workspace = true }
