[package]
name = "gem_evm"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["dep:async-trait", "dep:chain_traits", "dep:futures-util", "dep:gem_client", "gem_jsonrpc/client"]
indexer = ["rpc", "dep:alchemy", "dep:ankr", "dep:blockscout", "dep:etherscan"]
signer = ["dep:signer"]
chain_integration_tests = ["indexer"]

[dependencies]
primitives = { path = "../primitives" }
sign_in = { path = "../sign_in" }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }
gem_jsonrpc = { path = "../gem_jsonrpc" }
alchemy = { path = "../alchemy", features = ["rpc"], optional = true }
ankr = { path = "../ankr", optional = true }
blockscout = { path = "../blockscout", optional = true }
etherscan = { path = "../etherscan", optional = true }
gem_client = { path = "../gem_client", optional = true }
gem_hash = { path = "../gem_hash" }
signer = { path = "../signer", optional = true }

futures-util = { workspace = true, optional = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true, features = ["eip712-serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
url = { workspace = true }

# rpc feature
async-trait = { workspace = true, optional = true }
chain_traits = { path = "../chain_traits", optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_evm = { path = ".", features = ["rpc", "signer", "indexer"] }
chain_traits = { path = "../chain_traits" }
gem_client = { path = "../gem_client" }
ankr = { path = "../ankr" }
blockscout = { path = "../blockscout" }
etherscan = { path = "../etherscan" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
settings = { path = "../settings" }
async-trait = { workspace = true }
