[package]
name = "gem_hypercore"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
signer = []
chain_integration_tests = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num-bigint = { workspace = true }
alloy-primitives = { workspace = true }
futures-util = { workspace = true }
strum = { workspace = true }
zeroize = { workspace = true }

gem_client = { path = "../gem_client" }
gem_hash = { path = "../gem_hash" }
gem_evm = { path = "../gem_evm" }
serde_serializers = { path = "../serde_serializers" }
number_formatter = { path = "../number_formatter" }
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
chain_traits = { path = "../chain_traits" }
signer = { path = "../signer" }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_hypercore = { path = ".", features = ["signer"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
settings = { path = "../settings" }
