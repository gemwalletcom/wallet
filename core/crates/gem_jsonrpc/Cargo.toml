[package]
name = "gem_jsonrpc"
version = { workspace = true }
edition = { workspace = true }

[features]
default = ["types"]
types = []
client = ["dep:gem_client", "dep:async-trait", "dep:primitives", "dep:gem_encoding"]
uniffi = ["client", "dep:uniffi"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

gem_client = { path = "../gem_client", optional = true }
async-trait = { workspace = true, optional = true }
primitives = { path = "../primitives", optional = true }
gem_encoding = { path = "../gem_encoding", default-features = false, optional = true }
uniffi = { workspace = true, optional = true }

[dev-dependencies]
gem_jsonrpc = { path = ".", features = ["client"] }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt"] }
