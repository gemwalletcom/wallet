[package]
name = "gem_near"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
num-traits = { workspace = true }

primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num-bigint = { workspace = true }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }

# RPC specific dependencies
gem_jsonrpc = { path = "../gem_jsonrpc", features = ["client"], optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
gem_encoding = { path = "../gem_encoding", optional = true, features = ["base58"] }
gem_hash = { path = "../gem_hash", optional = true }
signer = { path = "../signer", optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_near = { path = ".", features = ["rpc", "signer"] }
chain_traits = { path = "../chain_traits" }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
settings = { path = "../settings" }

[features]
default = []
rpc = ["dep:gem_jsonrpc", "dep:gem_client", "dep:chain_traits", "dep:async-trait", "dep:futures-util", "dep:gem_encoding"]
signer = ["dep:gem_encoding", "dep:gem_hash", "dep:signer"]
chain_integration_tests = ["rpc"]
