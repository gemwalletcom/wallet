[package]
name = "gem_polkadot"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
signer = []
rpc = [
    "dep:serde_json",
    "dep:serde_serializers",
    "dep:async-trait",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:number_formatter",
    "dep:rand",
]
reqwest = ["gem_client/reqwest"]
chain_integration_tests = ["rpc", "reqwest", "primitives/testkit", "settings/testkit"]

[dependencies]
primitives = { path = "../primitives" }
serde = { workspace = true, features = ["derive"] }
num-bigint = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
bs58 = { workspace = true }
gem_hash = { path = "../gem_hash" }
hex = { workspace = true }
signer = { path = "../signer" }
rand = { workspace = true, optional = true }

# Optional RPC dependencies
serde_json = { workspace = true, optional = true }
serde_serializers = { path = "../serde_serializers", features = ["bigint"], optional = true }
async-trait = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
number_formatter = { path = "../number_formatter", optional = true }

[dev-dependencies]
chain_traits = { path = "../chain_traits", features = ["testkit"] }
gem_client = { path = "../gem_client", features = ["testkit"] }
tokio = { workspace = true, features = ["rt", "macros"] }
settings = { path = "../settings", features = ["testkit"] }
