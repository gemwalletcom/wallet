[package]
name = "gem_polkadot"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
signer = ["dep:signer"]
rpc = [
    "dep:serde_json",
    "dep:serde_serializers",
    "dep:async-trait",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:number_formatter",
    "dep:gem_crypto",
    "dep:futures",
    "dep:signer",
]
chain_integration_tests = ["rpc"]

[dependencies]
gem_encoding = { path = "../gem_encoding", default-features = false, features = ["base58"] }
num-traits = { workspace = true }
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
num-bigint = { workspace = true }
gem_hash = { path = "../gem_hash" }
signer = { path = "../signer", optional = true }
gem_crypto = { path = "../gem_crypto", features = ["random"], optional = true }

# Optional RPC dependencies
serde_json = { workspace = true, optional = true }
serde_serializers = { path = "../serde_serializers", features = ["bigint"], optional = true }
async-trait = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
number_formatter = { path = "../number_formatter", optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_polkadot = { path = ".", features = ["rpc", "signer"] }
chain_traits = { path = "../chain_traits" }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["rt", "macros"] }
settings = { path = "../settings" }
