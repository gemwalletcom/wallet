[package]
name = "gem_solana"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = [
    "gem_jsonrpc/client",
    "dep:async-trait",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:futures",
]
signer = ["dep:num-traits", "dep:signer"]
reqwest = ["gem_jsonrpc/reqwest"]
chain_integration_tests = [
    "rpc",
    "reqwest",
    "dep:settings",
]

[dependencies]
sha2 = { workspace = true }
borsh = { workspace = true }
gem_encoding = { path = "../gem_encoding", features = ["base58"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
num-bigint = { workspace = true }
gem_url = { path = "../gem_url" }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
gem_jsonrpc = { path = "../gem_jsonrpc" }
async-trait = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
futures = { workspace = true, optional = true }
settings = { path = "../settings", optional = true }
curve25519-dalek = { workspace = true }
num-traits = { workspace = true, optional = true }
signer = { path = "../signer", optional = true }

[dev-dependencies]
gem_solana = { path = ".", features = ["rpc", "signer"] }
chain_traits = { path = "../chain_traits" }
tokio = { workspace = true, features = ["macros", "rt"] }
primitives = { path = "../primitives", default-features = false }
gem_client = { path = "../gem_client" }
