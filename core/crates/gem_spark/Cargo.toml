[package]
name = "gem_spark"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = ["dep:async-trait", "dep:chain_traits", "dep:primitives", "dep:num-bigint", "dep:chrono", "dep:signer", "dep:gem_hash"]
wallet = ["dep:async-trait", "dep:bitcoin", "dep:primitives", "dep:frost-secp256k1-tr", "dep:rusqlite", "dep:spark-sqlite", "dep:spark-wallet", "dep:tokio"]
chain_integration_tests = ["wallet"]
testkit = []

[dependencies]
bech32 = { workspace = true }
lightning-invoice = { workspace = true }
chain_traits = { path = "../chain_traits", optional = true }
primitives = { path = "../primitives", optional = true }
signer = { path = "../signer", optional = true }
gem_hash = { path = "../gem_hash", optional = true }
num-bigint = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bitcoin = { workspace = true, optional = true }
frost-secp256k1-tr = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
spark-sqlite = { workspace = true, optional = true }
spark-wallet = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
signer = { path = "../signer" }
primitives = { path = "../primitives", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
