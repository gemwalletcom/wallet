[package]
name = "gem_sui"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:chain_traits",
    "dep:gem_client",
    "gem_encoding/protobuf",
    "dep:gem_jsonrpc",
    "dep:chain_primitives",
    "dep:futures",
]
reqwest = ["rpc", "gem_client/reqwest", "gem_jsonrpc/reqwest"]
signer = ["dep:signer"]
chain_integration_tests = ["rpc", "reqwest"]

[dependencies]
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
chain_primitives = { path = "../chain_primitives", optional = true }
bcs = { workspace = true }
gem_encoding = { path = "../gem_encoding", features = ["base58"] }
gem_hash = { path = "../gem_hash" }
gem_client = { path = "../gem_client", optional = true }
gem_jsonrpc = { path = "../gem_jsonrpc", features = ["client"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }
num-traits = { workspace = true }

futures = { workspace = true, optional = true }
signer = { path = "../signer", optional = true }

# Optional dependencies for rpc feature
num-bigint = { workspace = true, features = ["serde"] }
async-trait = { workspace = true, optional = true }
chain_traits = { path = "../chain_traits", optional = true }

[dev-dependencies]
gem_sui = { path = ".", features = ["rpc", "signer", "reqwest"] }
tokio = { workspace = true, features = ["macros", "rt"] }
gem_client = { path = "../gem_client" }
chain_traits = { path = "../chain_traits" }
settings = { path = "../settings" }
