[package]
name = "gem_ton"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
rpc = [
    "dep:async-trait",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:futures",
]
tvm = ["dep:gem_hash"]
signer = ["tvm", "dep:signer"]
chain_integration_tests = ["rpc"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
primitives = { path = "../primitives" }
date_time = { path = "../date_time", features = ["serde"] }
num-bigint = { workspace = true }
gem_encoding = { path = "../gem_encoding" }

serde_serializers = { path = "../serde_serializers", features = ["bigint"] }

# Optional RPC dependencies
async-trait = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
futures = { workspace = true, optional = true }

# Optional signer dependencies
signer = { path = "../signer", optional = true }
gem_hash = { path = "../gem_hash", optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_ton = { path = ".", features = ["rpc", "signer"] }
chain_traits = { path = "../chain_traits" }
gem_client = { path = "../gem_client" }
tokio = { workspace = true, features = ["macros", "rt"] }
settings = { path = "../settings" }
