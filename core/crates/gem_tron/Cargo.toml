[package]
name = "gem_tron"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
bs58 = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
primitives = { path = "../primitives" }
signer = { path = "../signer", optional = true }
gem_encoding = { path = "../gem_encoding", features = ["protobuf"] }
gem_hash = { path = "../gem_hash" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_serializers = { path = "../serde_serializers" }
strum = { workspace = true }

# RPC specific dependencies (optional)
chrono = { workspace = true, features = ["serde"], optional = true }
num-traits = { workspace = true, optional = true }
number_formatter = { path = "../number_formatter", optional = true }
gem_evm = { path = "../gem_evm", optional = true }
gem_client = { path = "../gem_client", optional = true }
chain_traits = { path = "../chain_traits", optional = true }
chain_primitives = { path = "../chain_primitives", optional = true }
async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
signer = ["dep:num-traits", "dep:signer"]
rpc = [
    "dep:chrono",
    "dep:num-traits",
    "dep:number_formatter",
    "dep:gem_evm",
    "dep:gem_client",
    "dep:chain_traits",
    "dep:chain_primitives",
    "dep:async-trait",
    "dep:futures",
]
reqwest = ["gem_client/reqwest"]
chain_integration_tests = ["rpc", "reqwest", "primitives/testkit", "settings/testkit"]

[dev-dependencies]
chain_traits = { path = "../chain_traits", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }
primitives = { path = "../primitives", features = ["testkit"] }
gem_client = { path = "../gem_client", features = ["reqwest", "testkit"] }
settings = { path = "../settings", features = ["testkit"] }
