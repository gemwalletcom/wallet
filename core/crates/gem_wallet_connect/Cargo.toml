[package]
name = "gem_wallet_connect"
edition = { workspace = true }
version = { workspace = true }

[features]
testkit = []

[dependencies]
primitives = { path = "../primitives" }
gem_evm = { path = "../gem_evm" }
gem_solana = { path = "../gem_solana" }
gem_ton = { path = "../gem_ton", features = ["signer"] }
gem_bitcoin = { path = "../gem_bitcoin", features = ["signer"] }

gem_encoding = { path = "../gem_encoding", features = ["base58"] }
chrono = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
primitives = { path = "../primitives", features = ["testkit"] }
gem_evm = { path = "../gem_evm", features = ["testkit"] }
