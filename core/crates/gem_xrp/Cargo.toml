[package]
name = "gem_xrp"
version = { workspace = true }
edition = { workspace = true }

[features]
default = []
signer = ["dep:signer", "dep:num-traits"]
rpc = ["dep:chain_traits", "dep:gem_client", "dep:futures-util", "gem_jsonrpc/client", "dep:async-trait"]
chain_integration_tests = ["rpc"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true, optional = true }
primitives = { path = "../primitives" }
number_formatter = { path = "../number_formatter" }
num-bigint = { workspace = true }
gem_encoding = { path = "../gem_encoding", default-features = false, features = ["base58"] }
gem_hash = { path = "../gem_hash" }
signer = { path = "../signer", optional = true }
num-traits = { workspace = true, optional = true }

chain_traits = { path = "../chain_traits", optional = true }
futures-util = { workspace = true, optional = true }
gem_client = { path = "../gem_client", optional = true }
gem_jsonrpc = { path = "../gem_jsonrpc" }

serde_serializers = { path = "../serde_serializers", features = ["bigint"] }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_xrp = { path = ".", features = ["rpc", "signer"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

settings = { path = "../settings" }
