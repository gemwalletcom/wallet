[package]
name = "gem_zcash"
version = { workspace = true }
edition = { workspace = true }
publish = false

[features]
default = []
rpc = ["gem_bitcoin/rpc", "signer", "dep:async-trait", "dep:chain_traits", "dep:gem_client", "dep:num-bigint", "dep:futures"]
chain_integration_tests = ["rpc"]
signer = ["dep:gem_bitcoin", "gem_bitcoin/signer", "dep:bitcoin", "dep:gem_hash", "dep:primitives"]

[dependencies]
primitives = { path = "../primitives", optional = true }
gem_bitcoin = { path = "../gem_bitcoin", optional = true }

async-trait = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bitcoin = { workspace = true, optional = true }
chain_traits = { path = "../chain_traits", optional = true }
gem_client = { path = "../gem_client", optional = true }
gem_hash = { path = "../gem_hash", optional = true }
num-bigint = { workspace = true, optional = true }

[dev-dependencies]
gem_reqwest = { path = "../gem_reqwest" }
gem_zcash = { path = ".", features = ["rpc", "signer"] }
gem_client = { path = "../gem_client" }
serde_json = { workspace = true }
settings = { path = "../settings" }
tokio = { workspace = true, features = ["macros", "rt"] }
