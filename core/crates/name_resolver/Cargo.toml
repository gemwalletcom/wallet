[package]
name = "name_resolver"
edition = { workspace = true }
version = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-ens = { version = "2.1.0" }
idna = { version = "1.1.0" }

gem_client = { path = "../gem_client", features = ["reqwest"] }
gem_jsonrpc = { path = "../gem_jsonrpc", features = ["reqwest"] }
gem_encoding = { path = "../gem_encoding", features = ["protobuf"] }
gem_hash = { path = "../gem_hash" }
gem_aptos = { path = "../gem_aptos", features = ["rpc"] }
gem_cosmos = { path = "../gem_cosmos", features = ["rpc"] }
gem_evm = { path = "../gem_evm", features = ["rpc"] }
gem_near = { path = "../gem_near", features = ["rpc", "reqwest"] }
gem_solana = { path = "../gem_solana" }
gem_ton = { path = "../gem_ton", features = ["rpc"] }
primitives = { path = "../primitives" }
settings = { path = "../settings" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "integration_test"
test = false
