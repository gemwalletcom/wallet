[package]
name = "swapper"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[features]
default = []
reqwest_provider = ["dep:reqwest", "gem_client/reqwest"]
swap_integration_tests = ["reqwest_provider"]
testkit = ["primitives/testkit"]

[dependencies]
primitives = { path = "../primitives" }
chain_primitives = { path = "../chain_primitives" }
gem_zcash = { path = "../gem_zcash", features = ["signer"] }
gem_solana = { path = "../gem_solana", features = ["rpc"] }
gem_ton = { path = "../gem_ton", features = ["rpc", "tvm"] }
gem_evm = { path = "../gem_evm", features = ["rpc"] }
gem_sui = { path = "../gem_sui", features = ["rpc"] }
gem_aptos = { path = "../gem_aptos", features = ["rpc"] }
gem_cosmos = { path = "../gem_cosmos" }
gem_tron = { path = "../gem_tron", default-features = false, features = ["rpc"] }
gem_xrp = { path = "../gem_xrp", features = ["rpc"] }
gem_stellar = { path = "../gem_stellar", features = ["rpc"] }
chain_traits = { path = "../chain_traits" }
gem_hash = { path = "../gem_hash" }
gem_jsonrpc = { path = "../gem_jsonrpc", features = ["client"] }
gem_client = { path = "../gem_client" }
gem_hypercore = { path = "../gem_hypercore" }
gem_polkadot = { path = "../gem_polkadot" }
serde_serializers = { path = "../serde_serializers", features = ["bigint"] }
number_formatter = { path = "../number_formatter" }
sui-types = { workspace = true }
sui-transaction-builder = { workspace = true }

reqwest = { workspace = true, optional = true }

strum = { workspace = true }

gem_encoding = { path = "../gem_encoding" }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
bcs.workspace = true
async-trait.workspace = true
chrono.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
hex.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
futures.workspace = true
bs58 = { workspace = true }
borsh = { workspace = true }
hex_lit = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
bigdecimal.workspace = true
rand.workspace = true

[dev-dependencies]
tokio.workspace = true
primitives = { path = "../primitives", features = ["testkit"] }
gem_client = { path = "../gem_client", features = ["testkit"] }
gem_jsonrpc = { path = "../gem_jsonrpc", features = ["testkit"] }
gem_evm = { path = "../gem_evm", features = ["testkit"] }
gem_hypercore = { path = "../gem_hypercore", features = ["testkit", "signer"] }
gem_sui = { path = "../gem_sui", features = ["reqwest"] }
gem_aptos = { path = "../gem_aptos", features = ["testkit"] }
settings = { path = "../settings", features = ["testkit"] }
