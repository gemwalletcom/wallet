[package]
name = "core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

gemstone = { path = "../gemstone" }
primitives = { path = "../crates/primitives" }
payment = { path = "../crates/payment" }
signer = { path = "../crates/signer" }
gem_client = { path = "../crates/gem_client", features = ["testkit"] }
gem_encoding = { path = "../crates/gem_encoding", features = ["protobuf"] }
gem_keystore = { path = "../crates/gem_keystore", features = ["v3"] }
gem_solana = { path = "../crates/gem_solana" }
gem_sui = { path = "../crates/gem_sui", features = ["rpc"] }
gem_ton = { path = "../crates/gem_ton", features = ["tvm"] }
gem_tron = { path = "../crates/gem_tron" }
gem_wallet_connect = { path = "../crates/gem_wallet_connect" }
gem_zcash = { path = "../crates/gem_zcash", features = ["rpc"] }
wallet_connect_protocol = { path = "../crates/wallet_connect_protocol" }
name_resolver = { path = "../crates/name_resolver" }

[[bin]]
name = "address"
path = "fuzz_targets/address.rs"

[[bin]]
name = "ens_resolution"
path = "fuzz_targets/ens_resolution.rs"

[[bin]]
name = "keystore_file"
path = "fuzz_targets/keystore_file.rs"

[[bin]]
name = "payment_url"
path = "fuzz_targets/payment_url.rs"

[[bin]]
name = "private_key"
path = "fuzz_targets/private_key.rs"

[[bin]]
name = "protobuf"
path = "fuzz_targets/protobuf.rs"

[[bin]]
name = "sign_message"
path = "fuzz_targets/sign_message.rs"

[[bin]]
name = "solana_transaction"
path = "fuzz_targets/solana_transaction.rs"

[[bin]]
name = "ton_boc"
path = "fuzz_targets/ton_boc.rs"

[[bin]]
name = "wallet_connect_request"
path = "fuzz_targets/wallet_connect_request.rs"

[[bin]]
name = "wallet_connect_transaction"
path = "fuzz_targets/wallet_connect_transaction.rs"

[[bin]]
name = "wallet_connect_protocol"
path = "fuzz_targets/wallet_connect_protocol.rs"

[[bin]]
name = "zcash_transaction"
path = "fuzz_targets/zcash_transaction.rs"

[profile.release]
debug = 1
