[bindings.kotlin]
cdylib_name = "gemstone"

[bindings.swift]
ffi_module_name = "GemstoneFFI"
generate_module_map = false
experimental_sendable_value_types = true
omit_localized_error_conformance = true
[bindings.kotlin.custom_types.GemBigInt]
type_name = "java.math.BigInteger"
lift = "java.math.BigInteger({})"
lower = "{}.toString()"

[bindings.kotlin.custom_types.GemBigUint]
type_name = "java.math.BigInteger"
lift = "java.math.BigInteger({})"
lower = "{}.toString()"

[bindings.swift.custom_types.GemBigInt]
type_name = "BigInt"
imports = ["BigInt"]
lift = "BigInt(stringLiteral: {})"
lower = "{}.description"

[bindings.swift.custom_types.GemBigUint]
type_name = "BigUInt"
imports = ["BigInt"]
lift = "BigUInt(stringLiteral: {})"
lower = "{}.description"

[bindings.kotlin.custom_types.DateTimeUtc]
type_name = "Long"
lift = "{} * 1000"
lower = "{} / 1000"

[bindings.swift.custom_types.DateTimeUtc]
type_name = "Date"
lift = "Date(timeIntervalSince1970: TimeInterval({}))"
lower = "Int64({}.timeIntervalSince1970)"

[bindings.swift.custom_types.PerpetualId]
type_name = "Primitives.PerpetualId"
imports = ["Primitives"]
lift = "Primitives.PerpetualId(core: {})"
lower = "{}.identifier"

[bindings.swift.custom_types.TransactionId]
type_name = "Primitives.TransactionId"
imports = ["Primitives"]
lift = "Primitives.TransactionId(core: {})"
lower = "{}.identifier"

[bindings.swift.custom_types.WalletId]
type_name = "Primitives.WalletId"
imports = ["Primitives"]
lift = "Primitives.WalletId(core: {})"
lower = "{}.identifier"
