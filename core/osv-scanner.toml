[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
reason = "derivative is unmaintained. It is only an optional dependency of ruint behind its ark-ff 0.3/0.4 features, which nothing enables, so it is listed in Cargo.lock but never compiled."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained. It is a compile-time macro used by alloy-primitives and syn-solidity, which still depend on it in their latest release, and it leaves nothing in the built code."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0374"
reason = "basic-toml is unmaintained. It reads TOML at compile time in askama (via uniffi_bindgen), which still depends on it in its latest release, and it only parses our own config files."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono is unmaintained. Core no longer depends on it; it stays in Cargo.lock only as an optional dependency of serde_with under ark-serialize, which ruint pulls in behind its ark-ff features that nothing enables, so it is never compiled."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5.5 has timing variability in operations meant to be constant-time. It is only an optional dependency of alloy-primitives through k256 0.13, which nothing enables, so it is listed in Cargo.lock but never compiled."
