appId: ${APP_ID}
---
- evalScript: ${output.journey = 'create'}
- runFlow: subflows/create_wallet.yaml
- runFlow: subflows/wallet_tour.yaml
- runFlow: subflows/manage_contact.yaml
- runFlow: subflows/rename_wallet.yaml
- runFlow: subflows/second_wallet.yaml
- runFlow:
    file: subflows/receive_bitcoin.yaml
    env:
      ADDRESS: "bc1q[a-z0-9]+"
- runFlow: subflows/activity_empty.yaml
