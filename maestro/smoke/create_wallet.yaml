appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- tapOn:
    id: "create"
- runFlow: subflows/accept_terms.yaml
- tapOn:
    id: "main_action"
- extendedWaitUntil:
    visible:
      id: "word_11"
    timeout: 10000
- copyTextFrom:
    id: "word_0"
- evalScript: ${output.word0 = maestro.copiedText}
- copyTextFrom:
    id: "word_1"
- evalScript: ${output.word1 = maestro.copiedText}
