appId: ${APP_ID}
---
- evalScript: ${output.journey = 'import'}
- runFlow: subflows/import_wallet.yaml
- runFlow: subflows/wallet_tour.yaml
- runFlow: subflows/manage_contact.yaml
- runFlow: subflows/contact_invalid_address.yaml
- runFlow: subflows/rename_wallet.yaml
- runFlow: subflows/second_wallet.yaml
- runFlow: subflows/view_only_wallet.yaml
- runFlow: subflows/duplicate_import.yaml
- runFlow: subflows/single_network_wallet.yaml
- runFlow:
    file: subflows/receive_bitcoin.yaml
    env:
      ADDRESS: ${BITCOIN_ADDRESS}
- runFlow: subflows/open_transaction.yaml
- runFlow: subflows/activity_filter.yaml
