appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "import"
    timeout: 30000
- tapOn:
    id: "import"
- runFlow: accept_terms.yaml
- tapOn:
    id: "multicoin_item"
- tapOn:
    id: "importInputField"
- inputText: ${TEST_PHRASE}
- tapOn:
    id: "main_action"
- runFlow: finish_onboarding.yaml
