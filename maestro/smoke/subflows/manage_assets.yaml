appId: ${APP_ID}
---
- runFlow: launch.yaml
- scrollUntilVisible:
    element:
      id: "manage"
    centerElement: true
- tapOn:
    id: "manage"
- tapOn:
    id: "asset_toggle"
    checked: true
    childOf:
      id: "ethereum"
- assertVisible:
    id: "asset_toggle"
    checked: false
    childOf:
      id: "ethereum"
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "bitcoin"
    timeout: 15000
- assertNotVisible:
    id: "ethereum"
- scrollUntilVisible:
    element:
      id: "manage"
    centerElement: true
- tapOn:
    id: "manage"
- tapOn:
    id: "asset_toggle"
    checked: false
    childOf:
      id: "ethereum"
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "ethereum"
    timeout: 15000
