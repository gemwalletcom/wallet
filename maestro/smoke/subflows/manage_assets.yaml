appId: ${APP_ID}
---
- runFlow: launch.yaml
- runFlow: open_manage.yaml
- tapOn:
    id: "asset_toggle"
    checked: true
    childOf:
      id: "ethereum"
- assertVisible:
    id: "asset_toggle"
    checked: false
    childOf:
      id: "ethereum"
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "bitcoin"
    timeout: 15000
- assertNotVisible:
    id: "ethereum"
- runFlow: open_manage.yaml
- tapOn:
    id: "asset_toggle"
    checked: false
    childOf:
      id: "ethereum"
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "ethereum"
    timeout: 15000
