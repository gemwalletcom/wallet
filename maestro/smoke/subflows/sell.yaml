appId: ${APP_ID}
---
- runFlow: launch.yaml
- tapOn:
    id: "buy_button"
- waitForAnimationToEnd
- tapOn:
    id: "bitcoin"
- extendedWaitUntil:
    visible: "Sell ?"
    timeout: 15000
- tapOn: "Sell ?"
- extendedWaitUntil:
    visible:
      id: "main_action"
      enabled: false
    timeout: 15000
- takeScreenshot: ${output.journey}_sell
