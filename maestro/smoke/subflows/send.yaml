appId: ${APP_ID}
---
- runFlow: launch.yaml
- tapOn:
    id: "bitcoin"
- waitForAnimationToEnd
- tapOn:
    id: "send_button"
- waitForAnimationToEnd
- tapOn:
    id: "addressInputField"
- inputText: ${BITCOIN_ADDRESS}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "main_action"
      enabled: true
    timeout: 15000
- tapOn:
    id: "main_action"
- runFlow: amount_over_balance.yaml
- takeScreenshot: ${output.journey}_send
