appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: "validator_row"
    timeout: 15000
- copyTextFrom:
    id: "validator_row"
- evalScript: ${output.validator = maestro.copiedText}
- tapOn:
    id: "validator_row"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "validator_item"
          checked: false
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "validator_item"
          selected: false
- waitForAnimationToEnd
- copyTextFrom:
    id: "validator_row"
- assertTrue: ${maestro.copiedText != output.validator}
- takeScreenshot: ${output.journey}_stake_validator
